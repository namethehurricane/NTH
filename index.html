		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			/* Footer styling: full width, center items, keep links active */
			#footer {
				width: 100%;
				text-align: center;
				padding: 0.3rem 0;
				box-sizing: border-box;
				position: relative;
				z-index: 0; /* make sure footer does NOT sit above the widget */
				margin-top: auto;
			}

			#footer .footer-links {
				display: flex;
				justify-content: center;
				align-items: center;
				flex-wrap: wrap;
				gap: 0.3rem;
				margin-bottom: 0;
			}

			#footer .footer-links a {
				display: inline-block;
				text-decoration: none;
				color: inherit;
				padding: 0;
			}

			#footer .footer-copy {
				display: flex;
				justify-content: center;
				align-items: center;
				flex-wrap: wrap;
				gap: 0.3rem;
				font-size: 0.65rem;
			}

			/* Keep the Elfsight widget visible and interactive: put it above the footer if they overlap */
			.elfsight-app-2fc9fbf5-210e-4c92-9809-0f874fd819d8 {
				display: block;
				position: relative; /* keep it in normal flow */
				z-index: 50; /* ensure widget receives pointer events if overlap happens */
				margin-bottom: 1rem; /* minimal gap between widget and footer */
				width: 100%;
				box-sizing: border-box;
				overflow-x: hidden;
			}

			/* Reduce body padding on mobile to allow more space for widget */
			body { 
				padding-bottom: 0;
				overflow-x: hidden;
				display: flex;
				flex-direction: column;
				min-height: 100vh;
			}

			/* Small screens: minimize spacing */
			@media (max-width: 768px) {
				#footer { 
					padding: 0.2rem 0; 
					margin-top: auto;
				}
				#footer .footer-links { gap: 0.2rem; }
				#footer .footer-copy { gap: 0.2rem; font-size: 0.6rem; }
				.elfsight-app-2fc9fbf5-210e-4c92-9809-0f874fd819d8 { 
					margin-bottom: 0.5rem;
					margin-top: 0.5rem;
				}
				body { padding-bottom: 0; }
			}

			@media (max-width: 480px) {
				#footer { padding: 0.2rem 0; }
				#footer .footer-links { gap: 0.15rem; }
				#footer .footer-copy { gap: 0.15rem; font-size: 0.55rem; }
				.elfsight-app-2fc9fbf5-210e-4c92-9809-0f874fd819d8 { 
					margin-bottom: 0;
					margin-top: 0.25rem;
				}
				body { 
					padding-bottom: 0;
					margin: 0;
				}
				#header {
					padding: 0.25rem;
				}
				#footer .booking-text {
					font-size: 0.6rem;
				}
			}

			/* Header image responsive rules */
			#header {
				overflow: visible; /* prevent clipping if image is taller */
				position: relative;
				padding-top: 1rem;
				text-align: center;
			}

			#header h1 { margin: 0; }

			#header h1 img {
				width: 100%;
				max-width: 900px; /* limit extremely large images */
				height: auto;
				display: block;
				margin: 0 auto;
				object-fit: contain;
				max-height: 60vh; /* prevent running off the top of the screen */
			}

			@media (max-width: 768px) {
				#header h1 img { 
					max-width: 95%; 
					max-height: 35vh; 
				}
			}

			@media (max-width: 480px) {
				#header h1 img { 
					max-width: 98%; 
					max-height: 25vh;
				}
			}

			/* Footer override — center footer and restore link interactivity */
			#footer {
				position: relative !important;
				left: auto !important;
				bottom: auto !important;
				width: 100% !important;
				margin: auto 0 !important;
				text-align: center !important;
				opacity: 1 !important;
				z-index: 20 !important;        /* ensure footer is above background overlays */
				pointer-events: auto !important;
			}

			#footer .footer-links,
			#footer .footer-copy {
				display: flex !important;
				justify-content: center !important;
				align-items: center !important;
			}

			#footer a {
				pointer-events: auto !important;
				color: inherit;
				text-decoration: none;
			}

			/* Booking text styling */
			#footer .booking-text {
				display: flex;
				justify-content: center;
				align-items: center;
				flex-wrap: wrap;
				gap: 0.3rem;
				font-size: 0.7rem;
				margin-bottom: 0.2rem;
			}

			#footer .booking-text a {
				color: inherit;
				text-decoration: underline;
				cursor: pointer;
			}

			#footer .booking-text a:hover {
				opacity: 0.8;
			}

			#footer .booking-socials {
				display: inline-flex;
				align-items: center;
				gap: 0.1rem;
			}

			/* Modal styling */
			.modal {
				display: none;
				position: fixed;
				z-index: 1000;
				left: 0;
				top: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(0, 0, 0, 0.5);
				overflow: auto;
			}

			.modal.active {
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.modal-content {
				background-color: #fefefe;
				padding: 2rem;
				border: 1px solid #888;
				border-radius: 8px;
				width: 90%;
				max-width: 500px;
				box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			}

			.modal-close {
				color: #aaa;
				float: right;
				font-size: 28px;
				font-weight: bold;
				cursor: pointer;
				line-height: 1;
			}

			.modal-close:hover,
			.modal-close:focus {
				color: black;
			}

			.modal h2 {
				margin-top: 0;
				color: #333;
			}

			.form-group {
				margin-bottom: 1.5rem;
				text-align: left;
			}

			.form-group label {
				display: block;
				margin-bottom: 0.5rem;
				color: #333;
				font-weight: bold;
			}

			.form-group input,
			.form-group textarea {
				width: 100%;
				padding: 0.75rem;
				border: 1px solid #ddd;
				border-radius: 4px;
				font-family: inherit;
				font-size: 1rem;
				box-sizing: border-box;
			}

			.form-group input:focus,
			.form-group textarea:focus {
				outline: none;
				border-color: #0066cc;
				box-shadow: 0 0 5px rgba(0, 102, 204, 0.3);
			}

			.form-group textarea {
				resize: vertical;
				min-height: 150px;
			}

			.button-group {
				display: flex;
				gap: 1rem;
				justify-content: center;
			}

			.btn {
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 0.75rem 1.5rem;
				border: none;
				border-radius: 4px;
				font-size: 1rem;
				cursor: pointer;
				transition: background-color 0.3s;
				min-height: 2.5rem;
			}

			.btn-submit {
				background-color: #0066cc;
				color: white;
			}

			.btn-submit:hover {
				background-color: #0052a3;
			}

			.btn-cancel {
				background-color: #ddd;
				color: #333;
			}

			.btn-cancel:hover {
				background-color: #ccc;
			}

			.form-message {
				padding: 1rem;
				border-radius: 4px;
				margin-bottom: 1rem;
				display: none;
			}

			.form-message.success {
				background-color: #d4edda;
				color: #155724;
				border: 1px solid #c3e6cb;
				display: block;
			}

			.form-message.error {
				background-color: #f8d7da;
				color: #721c24;
				border: 1px solid #f5c6cb;
				display: block;
			}
		</style>
	</head>
	<body class="is-preload">
		
		<!-- Header -->
		<header id="header">
			<div style="text-align: center;">
				<h1><img src="NTH Cascade.png" alt="Name The Hurricane" class="site-logo"></h1>
				<p></p>
			</div>
		</header>

		<!-- Elfsight Audio Player | Name The Hurricane -->
		<script src="https://elfsightcdn.com/platform.js" async style="max-width:100%;height:auto;"></script>
		<div class="elfsight-app-2fc9fbf5-210e-4c92-9809-0f874fd819d8" data-elfsight-app-lazy></div>


		<!-- Contact Form Modal -->
		<div id="contactModal" class="modal">
			<div class="modal-content">
				<span class="modal-close" onclick="closeContactForm()">&times;</span>
				<h2>Book Name The Hurricane</h2>
				<div id="formMessage" class="form-message"></div>
				<form id="contactForm" onsubmit="sendEmail(event)">
					<div class="form-group">
						<label for="name">Name:</label>
						<input type="text" id="name" name="name" required>
					</div>
					<div class="form-group">
						<label for="email">Email:</label>
						<input type="email" id="email" name="email" required>
					</div>
					<div class="form-group">
						<label for="message">Message:</label>
						<textarea id="message" name="message" required></textarea>
					</div>
					<div class="button-group">
						<button type="submit" class="btn btn-submit">Send</button>
						<button type="button" class="btn btn-cancel" onclick="closeContactForm()">Cancel</button>
					</div>
				</form>
			</div>
		</div>

		<!-- Footer -->
		<footer id="footer">
			<div class="booking-text">
				<span>Book Them</span>
				<a onclick="openContactForm()">Here</a>
				<span>or</span>
				<div class="booking-socials">
					<a href="https://www.instagram.com/namethehurricane/" class="icon brands fa-instagram"><span class="label">Instagram</span></a>
				</div>
			</div>
			<div class="footer-copy">
				<span>&copy; Name The Hurricane</span>
				<span>Credits: <a href="http://html5up.net">HTML5 UP</a></span>
			</div>
		</footer>

		<!-- Scripts -->
		<script src="assets/js/main.js"></script>
		<script>
			function openContactForm() {
				document.getElementById('contactModal').classList.add('active');
				document.body.style.overflow = 'hidden';
			}

			function closeContactForm() {
				document.getElementById('contactModal').classList.remove('active');
				document.getElementById('contactForm').reset();
				document.getElementById('formMessage').classList.remove('success', 'error');
				document.body.style.overflow = 'auto';
			}

			function sendEmail(event) {
				event.preventDefault();
				
				const name = document.getElementById('name').value;
				const email = document.getElementById('email').value;
				const message = document.getElementById('message').value;
				const formMessage = document.getElementById('formMessage');

				// Create mailto link with pre-filled subject and body
				const subject = encodeURIComponent(`Booking Inquiry from ${name}`);
				const body = encodeURIComponent(`Name: ${name}\nEmail: ${email}\n\nMessage:\n${message}`);
				const mailtoLink = `mailto:namethehurricane@protonmail.com?subject=${subject}&body=${body}`;

				// Attempt to open email client
				window.location.href = mailtoLink;

				// Show success message
				formMessage.textContent = 'Opening your email client... If it doesn\'t open, please copy the information and email it manually.';
				formMessage.classList.add('success');
				formMessage.classList.remove('error');

				// Close modal after 2 seconds
				setTimeout(() => {
					closeContactForm();
				}, 2000);
			}

			// Close modal when clicking outside of it
			window.onclick = function(event) {
				const modal = document.getElementById('contactModal');
				if (event.target === modal) {
					closeContactForm();
				}
			}
		</script>

	</body>
</html>
