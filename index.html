		<style>
			/* Responsive Footer */
			footer {
				padding: 20px 10px;
				text-align: center;
				width: 100%;
				box-sizing: border-box;
			}

			/* Responsive List Items */
			footer ul {
				list-style: none;
				padding: 0;
				margin: 10px 0;
				display: flex;
				flex-wrap: wrap;

				height: 40px;

				footer {

				}

				}

				footer ul li {

					width: 100%;
				}

				footer ul.icons a {
					width: 36px;
					height: 36px;
					font-size: 18px;
				}
			}

			@media (max-width: 480px) {
				footer {
					padding: 10px 5px;
				}

				footer ul li {
					font-size: 12px;
				}
